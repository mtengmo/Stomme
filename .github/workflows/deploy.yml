name: CI and deploy

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer pull request push cancels the older run. For main/dev
# pushes nothing in progress is cancelled, but a newer queued run replaces an older
# PENDING one (the latest commit still runs and deploys). Deploys are serialised
# separately (see deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Vitest with the 100% branch gate on src/rules.
      - run: npm run test:cov

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The app version is the commit count, so the build needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Upload dist for the browser tests
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 3
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Browser smoke tests only (the @smoke tag: pain gate, Pass A flow, offline, settings
  # import/delete, PWA). The full suite, the a11y audit and the upgrade test run locally
  # (npm run e2e, npm run audit:a11y, npm run test:upgrade) or on demand via quality.yml.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # vite.config.ts computes the version from git history, even for `vite preview`.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system packages
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system packages only (browser cached)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Uses the downloaded dist; CI=1 sets the CI worker count and retries.
      - run: npm run e2e:prebuilt -- --grep @smoke
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: test-results
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploys queue instead of cancelling each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
