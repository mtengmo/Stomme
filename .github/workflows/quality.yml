name: Quality

# Slower checks that do not gate every push: the accessibility audit and the
# service-worker upgrade test. Run nightly, on demand, and on pull requests that
# touch styling, shared UI, the HTML shell, the build config or the audit itself.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/styles/**'
      - 'src/ui/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/a11y-audit.ts'
      - 'scripts/contrast.ts'
      - 'scripts/test-upgrade.ts'
      - 'scripts/buildVersion.ts'
      - 'src/lib/update.ts'
      - 'src/main.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # vite.config.ts computes the version from git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system packages
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system packages only (browser cached)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The script audits light and dark in one run (it has no scheme argument).
      - run: npm run audit:a11y
      # TODO(themes): run the @themes e2e and shots:themes once they exist.

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The upgrade test builds earlier commits, so it needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system packages
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system packages only (browser cached)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:upgrade
      - name: Upload upgrade artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-artifacts
          path: test-results/pwa-upgrade
          if-no-files-found: ignore
          retention-days: 7
